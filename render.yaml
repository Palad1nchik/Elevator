# Blueprint для Render: ОДИН веб-сервис, собираемый из корневого Dockerfile.
# Go-бэкенд внутри контейнера отдаёт и API, и собранный React-фронтенд,
# поэтому у сайта и API общий домен — не нужно связывать два сервиса,
# настраивать CORS или зашивать URL бэкенда в сборку фронтенда.
#
# Как деплоить — пошагово в DEPLOY.md. Кратко:
#   Render Dashboard -> New -> Blueprint -> выбрать этот репозиторий -> Deploy.
#
# ВАЖНО: сервисы от старой двухсервисной схемы (back-zekm, front-q4gq),
# созданные вручную, больше не нужны — удалите их в панели Render
# (Settings -> Delete Service), чтобы не путаться и не занимать лимиты.
services:
  - type: web
    name: kasper-site
    runtime: docker
    plan: free # бесплатный тариф; без этой строки Blueprint создаст платный starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      # PORT задавать не нужно: Render сам передаёт PORT (обычно 10000),
      # а сервер читает его из окружения (backend/internal/config/config.go).
      # CORS_ORIGINS не нужен: фронтенд и API на одном домене.
