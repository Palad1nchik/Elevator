# Kasper Elevator — весь сайт в одном контейнере: Go-бэкенд отдаёт и API,
# и собранный React-фронтенд. Это тот же образ, который деплоится на Render.
#
#   docker compose up --build
#
# Сайт: http://localhost:8080 · API: http://localhost:8080/api/health

services:
  web:
    build:
      context: .
    image: kasper-site:latest
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
